name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: False

jobs:
  check:
    name: Tests and Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      POETRY_NO_INTERACTION: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Check dependency lock file
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with test --no-root

      - name: Start test infrastructure
        run: >
          docker compose -f compose.ci.yaml
          up -d --build --wait --wait-timeout 180

      - name: Check database migrations
        env:
          DB_URL: postgresql+asyncpg://account_test:ci_db_password@127.0.0.1:5432/account_service_test
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

      - name: Run all tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://account_test:ci_db_password@127.0.0.1:5432/account_service_test
          TEST_RABBITMQ_URL: amqp://account_test:ci_rabbit_password@127.0.0.1:5672/account_test
          TEST_MINIO_ENDPOINT: 127.0.0.1:9000
          TEST_MINIO_ACCESS_KEY: ci_minio
          TEST_MINIO_SECRET_KEY: ci_minio_password
        run: poetry run pytest -q

      - name: Build application image
        run: docker build --pull --tag account-service:ci .

      - name: Show infrastructure logs on failure
        if: failure()
        run: >
          docker compose -f compose.ci.yaml
          logs --no-color --tail 100

      - name: Remove test infrastructure
        if: always()
        run: >
          docker compose -f compose.ci.yaml
          down --volumes --remove-orphans


  publish:
    name: Publish Docker images
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      APP_IMAGE: ghcr.io/nikbaben/test-ci-cd
      MINIO_IMAGE: ghcr.io/nikbaben/test-ci-cd-minio

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Build application image
        run: |
          docker build --pull \
            --tag "${APP_IMAGE}:${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            .

      - name: Build MinIO image
        run: |
          docker build --pull \
            --tag "${MINIO_IMAGE}:${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            ./dev/minio

      - name: Push images
        run: |
          docker push "${APP_IMAGE}:${GITHUB_SHA}"
          docker push "${MINIO_IMAGE}:${GITHUB_SHA}"

  
  deploy:
    name: Deploy Account Service
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment: production

    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy_known_hosts"

          cat > "$RUNNER_TEMP/ssh_config" <<EOF
          Host deployment
              HostName $DEPLOY_HOST
              User $DEPLOY_USER
              IdentityFile $RUNNER_TEMP/deploy_key
              UserKnownHostsFile $RUNNER_TEMP/deploy_known_hosts
              StrictHostKeyChecking yes
              BatchMode yes
              IdentitiesOnly yes
              RequestTTY no
              ConnectTimeout 15
              ServerAliveInterval 30
              ServerAliveCountMax 6
          EOF

      - name: Upload release files
        shell: bash
        run: |
          set -euo pipefail
          release_dir="/opt/account-service/releases/$GITHUB_SHA"

          tar -czf - \
            compose.production.yaml \
            docker/keycloak/product-service-realm.json \
            deploy.sh |
            ssh -F "$RUNNER_TEMP/ssh_config" deployment \
              "umask 077; mkdir -p '$release_dir' && tar -xzf - -C '$release_dir'"

      - name: Authorize server to download images
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config_dir="/opt/account-service/releases/$GITHUB_SHA/.docker"

          printf '%s' "$GHCR_TOKEN" |
            ssh -F "$RUNNER_TEMP/ssh_config" deployment \
              "umask 077; mkdir -p '$config_dir' && docker --config '$config_dir' login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy release
        shell: bash
        run: |
          ssh -F "$RUNNER_TEMP/ssh_config" deployment \
            "bash '/opt/account-service/releases/$GITHUB_SHA/deploy.sh'"

      - name: Remove deployment credentials
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ssh_config" ]]; then
            ssh -F "$RUNNER_TEMP/ssh_config" deployment \
              "rm -f '/opt/account-service/releases/$GITHUB_SHA/.docker/config.json'" || true
          fi

          rm -f \
            "$RUNNER_TEMP/deploy_key" \
            "$RUNNER_TEMP/deploy_known_hosts" \
            "$RUNNER_TEMP/ssh_config"