name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: False

jobs:
  check:
    name: Tests and Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      POETRY_NO_INTERACTION: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Check dependency lock file
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with test --no-root

      - name: Start test infrastructure
        run: >
          docker compose -f compose.ci.yaml
          up -d --build --wait --wait-timeout 180

      - name: Check database migrations
        env:
          DB_URL: postgresql+asyncpg://account_test:ci_db_password@127.0.0.1:5432/account_service_test
        run: |
          poetry run alembic upgrade head
          poetry run alembic check

      - name: Run all tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://account_test:ci_db_password@127.0.0.1:5432/account_service_test
          TEST_RABBITMQ_URL: amqp://account_test:ci_rabbit_password@127.0.0.1:5672/account_test
          TEST_MINIO_ENDPOINT: 127.0.0.1:9000
          TEST_MINIO_ACCESS_KEY: ci_minio
          TEST_MINIO_SECRET_KEY: ci_minio_password
        run: poetry run pytest -q

      - name: Build application image
        run: docker build --pull --tag account-service:ci .

      - name: Show infrastructure logs on failure
        if: failure()
        run: >
          docker compose -f compose.ci.yaml
          logs --no-color --tail 100

      - name: Remove test infrastructure
        if: always()
        run: >
          docker compose -f compose.ci.yaml
          down --volumes --remove-orphans


  publish:
    name: Publish Docker images
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      APP_IMAGE: ghcr.io/nikbaben/test-ci-cd
      MINIO_IMAGE: ghcr.io/nikbaben/test-ci-cd-minio

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Build application image
        run: |
          docker build --pull \
            --tag "${APP_IMAGE}:${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            .

      - name: Build MinIO image
        run: |
          docker build --pull \
            --tag "${MINIO_IMAGE}:${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            ./dev/minio

      - name: Push images
        run: |
          docker push "${APP_IMAGE}:${GITHUB_SHA}"
          docker push "${MINIO_IMAGE}:${GITHUB_SHA}"

  
  verify-server:
    name: Verify server access
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    environment: production
    permissions: {}

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Prepare SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy_known_hosts"

      - name: Check SSH and Docker access
        shell: bash
        run: |
          ssh -T \
            -i "$RUNNER_TEMP/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy_known_hosts" \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'whoami && docker ps'

      - name: Remove SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"