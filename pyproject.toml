[project]
name = "account-service"
version = "0.1.0"
description = ""
authors = [
    {name = "nikBaben",email = "bikita.nabkin@gmail.com"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "pydantic (>=2.14.1,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.31.0,<1.0.0)",
    "alembic (>=1.16.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "fastapi (>=0.143.3,<0.144.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "PyJWT[crypto] (>=2.15.1,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "uvicorn (>=0.35.0,<1.0.0)",
    "minio (>=7.2.0,<8.0.0)",
    "python-multipart (>=0.0.20,<1.0.0)",
    "aio-pika (>=10.1.1,<11.0.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
test = ["pytest (>=8.4.0,<10.0.0)"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["rabbitmq_integration: requires a dedicated test RabbitMQ vhost and PostgreSQL test DB"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
