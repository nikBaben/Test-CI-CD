name: account-service-ci

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: account_service_test
      POSTGRES_USER: account_test
      POSTGRES_PASSWORD: ci_db_password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U account_test -d account_service_test
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: account_test
      RABBITMQ_DEFAULT_PASS: ci_rabbit_password
      RABBITMQ_DEFAULT_VHOST: account_test
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    build:
      context: ./dev/minio
    environment:
      MINIO_ROOT_USER: ci_minio
      MINIO_ROOT_PASSWORD: ci_minio_password
    command: ["server", "/data"]
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 20